<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK FinServ - Premium Badge Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #001f3f;
            --gold: #c5a059;
            --silver: #bfc1c2;
            --platinum: #e5e4e2;
            --bg-dark: #050a18;
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            color: white;
        }

        /* ── PREMIUM TIER COLORS ── */

        /* Silver: Deep chrome with cool blue-steel shimmer */
        .tier-silver {
            --accent: #8fa8c8;
            --gradient: linear-gradient(135deg,
                #f0f4f8 0%,
                #c8d8e8 20%,
                #8fa8c8 40%,
                #b8cfe0 55%,
                #6888a8 70%,
                #a0bcd4 85%,
                #dce8f4 100%
            );
        }

        /* Gold: Deep molten gold with champagne highlights */
        .tier-gold {
            --accent: #c8920a;
            --gradient: linear-gradient(135deg,
                #fdf3d0 0%,
                #e8b830 15%,
                #c8920a 35%,
                #f5d060 50%,
                #a06800 65%,
                #e0a820 80%,
                #faeaa0 100%
            );
        }

        /* Platinum: Icy white with violet-titanium shimmer */
        .tier-platinum {
            --accent: #7060a8;
            --gradient: linear-gradient(135deg,
                #ffffff 0%,
                #e8e4f4 18%,
                #b0a8d0 35%,
                #f0eef8 50%,
                #8878b8 65%,
                #d4d0e8 82%,
                #ffffff 100%
            );
        }

        /* Actual 1080x1080 Canvas (Hidden) */
        #badge-container {
            width: 1080px;
            height: 1080px;
            background-color: #fdfcf8;
            position: absolute;
            left: -9999px;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Responsive Preview Wrapper */
        .preview-area {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1/1;
            background: #fdfcf8;
            border-radius: 12px;
            box-shadow: 0 40px 100px -20px rgba(0,0,0,0.7);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The Badge Graphic Structure */
        .badge-base {
            width: 860px;
            height: 860px;
            background: white;
            border-radius: 50%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15), inset 0 0 40px rgba(0,0,0,0.05);
            border: 15px solid transparent;
            background-clip: padding-box;
            padding: 60px;
            text-align: center;
        }

        /* Shape Variations */
        .shape-shield { border-radius: 10% 10% 50% 50% / 5% 5% 20% 20%; border-top-left-radius: 50% 10%; border-top-right-radius: 50% 10%; }
        .shape-star { clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }

        .metallic-border {
            position: absolute;
            top: -20px; left: -20px; right: -20px; bottom: -20px;
            border-radius: inherit;
            background: var(--gradient);
            z-index: -1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* ── Silver badge interior ── */
        .tier-silver .badge-base {
            background: linear-gradient(160deg, #f8fafd 0%, #e8f0f8 40%, #d8e8f4 100%);
        }
        .tier-silver .tier-label { color: #4a70a0; }
        .tier-silver .main-title { color: #1a2a3f; }
        .tier-silver .divider-bar { background: linear-gradient(90deg, transparent, #8fa8c8, transparent); }
        .tier-silver .issued-to { color: #1a2a3f; }
        .tier-silver .fy-text { color: #3a5070; }
        .tier-silver .assisted-label { color: #1a2a3f; }
        .tier-silver .assisted-brand { color: #4a70a0; }
        .tier-silver .footer-text { color: #5a7090; }

        /* ── Gold badge interior ── */
        .tier-gold .badge-base {
            background: linear-gradient(160deg, #fdfaf0 0%, #f8f0d0 40%, #f0e0a0 100%);
        }
        .tier-gold .tier-label { color: #a06800; }
        .tier-gold .main-title { color: #001f3f; }
        .tier-gold .divider-bar { background: linear-gradient(90deg, transparent, #c8920a, transparent); }
        .tier-gold .issued-to { color: #001f3f; }
        .tier-gold .fy-text { color: #3a3010; }
        .tier-gold .assisted-label { color: #001f3f; }
        .tier-gold .assisted-brand { color: #a06800; }
        .tier-gold .footer-text { color: #6a5820; }

        /* ── Platinum badge interior ── */
        .tier-platinum .badge-base {
            background: linear-gradient(160deg, #ffffff 0%, #f4f0fc 40%, #e8e0f8 100%);
        }
        .tier-platinum .tier-label { color: #5040a0; }
        .tier-platinum .main-title { color: #12082a; }
        .tier-platinum .divider-bar { background: linear-gradient(90deg, transparent, #7060a8, transparent); }
        .tier-platinum .issued-to { color: #12082a; }
        .tier-platinum .fy-text { color: #3a2858; }
        .tier-platinum .assisted-label { color: #12082a; }
        .tier-platinum .assisted-brand { color: #5040a0; }
        .tier-platinum .footer-text { color: #6a58a0; }

        .tier-label {
            font-size: 24px;
            letter-spacing: 0.4em;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .main-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 72px;
            line-height: 1;
            margin: 20px 0;
            text-transform: uppercase;
        }

        .badge-footer-info {
            position: absolute;
            bottom: -110px;
            width: 1000px;
            text-align: center;
            font-size: 16px;
        }

        .input-group input, .input-group select {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            margin-top: 5px;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: rgba(255,255,255,0.3);
        }

        .input-group input[style*="border-color: #ff6b6b"] {
            border-color: #ff6b6b !important;
            background: rgba(255, 107, 107, 0.1) !important;
        }

        .input-group select option { background: #050a18; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
        
        <!-- Controls -->
        <div class="space-y-6">
            <header>
                <h1 class="text-3xl font-bold gold-text">Badge <span class="text-white">Customizer</span></h1>
                <p class="text-gray-400">Create a high-impact recognition badge for your clients.</p>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="input-group">
                    <label class="text-xs font-bold text-gray-500 uppercase">Client Name <span style="color: #ff6b6b;">*</span></label>
                    <input type="text" id="nameIn" placeholder="Enter Name" oninput="validateName()" required minlength="3">
                    <div id="nameError" style="color: #ff6b6b; font-size: 12px; margin-top: 5px; display: none;"></div>
                </div>
                <div class="input-group">
                    <label class="text-xs font-bold text-gray-500 uppercase">Financial Year</label>
                    <input type="text" id="fyIn" value="FY 2024-25" oninput="render()">
                </div>
                <div class="input-group">
                    <label class="text-xs font-bold text-gray-500 uppercase">Select Tier</label>
                    <select id="tierIn" onchange="render()">
                        <option value="silver">Silver Tier (Regular)</option>
                        <option value="gold" selected>Gold Tier (Proud)</option>
                        <option value="platinum">Platinum Tier (Elite)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label class="text-xs font-bold text-gray-500 uppercase">Badge Style</label>
                    <select id="shapeIn" onchange="render()">
                        <option value="circle">Circular Medal</option>
                        <option value="shield">Classic Shield</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-4 pt-4">
                <button onclick="download()" class="flex-1 bg-gradient-to-r from-yellow-600 to-yellow-400 text-navy-900 font-bold py-4 rounded-xl shadow-lg hover:opacity-90 transition-all uppercase text-sm tracking-widest">
                    Download PNG
                </button>
            </div>
            
            <p class="text-[10px] text-gray-500 text-center uppercase tracking-tighter">
                Designed for LinkedIn, Instagram & WhatsApp Status
            </p>
        </div>

        <!-- Preview -->
        <div class="flex flex-col items-center">
            <div class="preview-area" id="preview-render-target">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <!-- Export Container -->
    <div id="badge-container">
        <div id="badge-content"></div>
    </div>

    <script>
        // Validate Client Name: only alphabets and spaces, minimum 3 characters
        function validateName() {
            const nameInput = document.getElementById('nameIn');
            const nameError = document.getElementById('nameError');
            const value = nameInput.value;

            // Only allow alphabets and spaces
            const validPattern = /^[a-zA-Z\s]*$/;
            
            // Check if input contains invalid characters
            if (value && !validPattern.test(value)) {
                nameInput.value = value.replace(/[^a-zA-Z\s]/g, '');
                return;
            }

            // Validate length and show error
            if (value.length > 0 && value.length < 3) {
                nameError.textContent = '✗ Name must be at least 3 characters';
                nameError.style.display = 'block';
                nameInput.style.borderColor = '#ff6b6b';
            } else if (value.length === 0) {
                nameError.textContent = '✗ Client name is required';
                nameError.style.display = 'block';
                nameInput.style.borderColor = '#ff6b6b';
            } else {
                nameError.style.display = 'none';
                nameInput.style.borderColor = '';
            }

            // Render preview
            render();
        }

        function getBadgeHTML(isExport = false) {
            const nameInput = document.getElementById('nameIn');
            const name = nameInput.value.trim() || 'VALUED CLIENT';
            const fy = document.getElementById('fyIn').value || 'FY 2024-25';
            const tier = document.getElementById('tierIn').value;
            const shape = document.getElementById('shapeIn').value;

            let title = "PROUD RESPONSIBLE TAXPAYER";
            let tierName = "GOLD TIER";
            if(tier === 'silver') { title = "CONSISTENT TAXPAYER"; tierName = "SILVER TIER"; }
            if(tier === 'platinum') { title = "ELITE COMPLIANT TAXPAYER"; tierName = "PLATINUM TIER"; }

            const shapeClass = shape === 'shield' ? 'shape-shield' : '';
            const scale = isExport ? 1 : (document.getElementById('preview-render-target').offsetWidth / 1080);

            /* ── Per-tier inline color tokens ── */
            const styles = {
                silver: {
                    bg:         'linear-gradient(160deg, #f8fafd 0%, #e8f0f8 40%, #d8e8f4 100%)',
                    border:     'linear-gradient(135deg, #f0f4f8 0%, #c8d8e8 20%, #8fa8c8 40%, #b8cfe0 55%, #6888a8 70%, #a0bcd4 85%, #dce8f4 100%)',
                    tierColor:  '#4a70a0',
                    titleColor: '#1a2a3f',
                    divider:    'linear-gradient(90deg, transparent, #8fa8c8, transparent)',
                    issuedTo:   '#1a2a3f',
                    fyColor:    '#3a5070',
                    asstLabel:  '#1a2a3f',
                    asstBrand:  '#4a70a0',
                    footer:     '#5a7090',
                    councilColor: '#1a2a3f',
                    taglineColor: '#4a70a0',
                },
                gold: {
                    bg:         'linear-gradient(160deg, #fdfaf0 0%, #f8f0d0 40%, #f0e0a0 100%)',
                    border:     'linear-gradient(135deg, #fdf3d0 0%, #e8b830 15%, #c8920a 35%, #f5d060 50%, #a06800 65%, #e0a820 80%, #faeaa0 100%)',
                    tierColor:  '#a06800',
                    titleColor: '#001f3f',
                    divider:    'linear-gradient(90deg, transparent, #c8920a, transparent)',
                    issuedTo:   '#001f3f',
                    fyColor:    '#3a3010',
                    asstLabel:  '#001f3f',
                    asstBrand:  '#a06800',
                    footer:     '#6a5820',
                    councilColor: '#001f3f',
                    taglineColor: '#c8920a',
                },
                platinum: {
                    bg:         'linear-gradient(160deg, #ffffff 0%, #f4f0fc 40%, #e8e0f8 100%)',
                    border:     'linear-gradient(135deg, #ffffff 0%, #e8e4f4 18%, #b0a8d0 35%, #f0eef8 50%, #8878b8 65%, #d4d0e8 82%, #ffffff 100%)',
                    tierColor:  '#5040a0',
                    titleColor: '#12082a',
                    divider:    'linear-gradient(90deg, transparent, #7060a8, transparent)',
                    issuedTo:   '#12082a',
                    fyColor:    '#3a2858',
                    asstLabel:  '#12082a',
                    asstBrand:  '#5040a0',
                    footer:     '#6a58a0',
                    councilColor: '#12082a',
                    taglineColor: '#7060a8',
                },
            };
            const s = styles[tier];

            return `
            <div style="transform: scale(${scale}); transform-origin: center;" class="tier-${tier}">
                <div class="badge-base ${shapeClass}" style="background:${s.bg};">
                    <div class="metallic-border" style="background:${s.border};"></div>
                    
                    <!-- MK LOGO -->
                    <img src="images/logo1.png" 
                         alt="MK Logo" 
                         style="width: 180px; margin-bottom: 20px; object-fit: contain;">

                    <div style="color:${s.councilColor}; font-weight:600; letter-spacing:0.1em; font-size:20px;">MK FINANCIAL COUNCIL</div>
                    <div style="color:${s.taglineColor}; font-style:italic; font-size:16px; margin-bottom:30px;">Where Discipline Meets Wealth</div>

                    <div class="tier-label" style="color:${s.tierColor};">${tierName}</div>
                    <div class="main-title" style="color:${s.titleColor};">${title}</div>
                    
                    <div style="width:100px; height:3px; background:${s.divider}; margin:30px 0;"></div>

                    <div style="font-size:28px; color:${s.issuedTo};">Issued to <strong style="font-weight:800;">${name}</strong></div>
                    <div style="font-size:22px; color:${s.fyColor}; margin-top:10px;">Filed Income Tax Return – ${fy}</div>

                    <div style="margin-top:40px; font-weight:600; color:${s.asstLabel}; font-size:18px;">
                        Assisted by: <br>
                        <span style="color:${s.asstBrand};">MK FinServ – Tax & Compliance</span>
                    </div>

                    <div class="badge-footer-info" style="color:${s.footer};">
                        Private recognition by Mk FinServ Group. Not affiliated with any government authorities.<br>
                        <strong>www.mkfinservgroup.com</strong>
                    </div>
                </div>
            </div>
            `;
        }

        function render() {
            document.getElementById('preview-render-target').innerHTML = getBadgeHTML(false);
            document.getElementById('badge-container').innerHTML = getBadgeHTML(true);
        }

        async function download() {
            const nameInput = document.getElementById('nameIn');
            const nameError = document.getElementById('nameError');
            const name = nameInput.value.trim();

            // Validate name before download
            if (!name) {
                nameError.textContent = '✗ Client name is required';
                nameError.style.display = 'block';
                nameInput.style.borderColor = '#ff6b6b';
                nameInput.focus();
                return;
            }

            if (name.length < 3) {
                nameError.textContent = '✗ Name must be at least 3 characters';
                nameError.style.display = 'block';
                nameInput.style.borderColor = '#ff6b6b';
                nameInput.focus();
                return;
            }

            const validPattern = /^[a-zA-Z\s]*$/;
            if (!validPattern.test(name)) {
                nameError.textContent = '✗ Name can only contain alphabets and spaces';
                nameError.style.display = 'block';
                nameInput.style.borderColor = '#ff6b6b';
                nameInput.focus();
                return;
            }

            // Clear error and proceed with download
            nameError.style.display = 'none';
            nameInput.style.borderColor = '';

            const container = document.getElementById('badge-container');
            const canvas = await html2canvas(container, {
                width: 1080,
                height: 1080,
                scale: 1,
                backgroundColor: '#fdfcf8'
            });
            
            const link = document.createElement('a');
            link.download = `MK_Badge_${name}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        window.addEventListener('resize', render);
        window.onload = render;
    </script>
</body>
</html>
